spring.application.name=mcp

# MCP Server Configuration (STDIO mode)
spring.ai.mcp.server.stdio=true
spring.main.web-application-type=none
spring.main.banner-mode=off
# Disable console logging to avoid interfering with MCP STDIO JSON-RPC
# We are routing logs to a file via logback-spring.xml instead

# Postgres Database Configuration (Update with your credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
