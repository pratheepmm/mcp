spring.application.name=mcp

# MCP Server Configuration (SSE mode)
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=ASYNC
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.main.web-application-type=reactive
spring.main.banner-mode=off
server.port=8080
# Disable console logging to avoid interfering with MCP STDIO JSON-RPC
# We are routing logs to a file via logback-spring.xml instead

# Postgres Database Configuration (Update with your credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
